<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0e1a2b" />
    <title>Skullshift</title>
    <link rel="icon" href="./assets/chars/skull_avatar.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #0e1a2b; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; display: block; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0e1a2b; color: #fff7dc;
        font: 700 20px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; padding: 24px; }
      #rotate span { display: block; font-size: 56px; transform: rotate(90deg); margin-bottom: 12px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; flex-direction: column; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><span>📱</span>Deite o celular para jogar</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
