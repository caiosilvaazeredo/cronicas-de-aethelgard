<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0e1a2b" />
    <title>Skullshift</title>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skullshift" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; background: #0e1a2b; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; display: block; }
      /* Enquanto o JS baixa: a caveira pulsando (some quando o jogo começa a desenhar). */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; pointer-events: none; }
      #boot img { width: 96px; height: 96px; image-rendering: pixelated; animation: pulse 1s ease-in-out infinite alternate; }
      #boot i { display: block; width: 140px; height: 8px; border-radius: 4px; background: #1d3352; overflow: hidden; position: relative; }
      #boot i::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 4px; background: #ffe066; animation: slide 1.1s ease-in-out infinite; }
      @keyframes pulse { to { transform: scale(1.12); } }
      @keyframes slide { from { left: -40%; } to { left: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot"><img src="./icons/icon-192.png" alt="" onerror="this.style.display='none'" /><i></i></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
